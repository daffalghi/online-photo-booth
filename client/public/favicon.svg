<svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ss-rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" />
      <stop offset="60%" stop-color="#ff5e97" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="ss-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ss-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Snap Frame (Top Left) - 100% Transparent -->
  <rect x="8" y="8" width="48" height="48" rx="15" fill="none" stroke="url(#ss-rose-grad)" stroke-width="6" />
  <path d="M 17 24 V 17 H 24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95" />

  <!-- Sync Frame (Bottom Right) - 100% Transparent -->
  <rect x="40" y="40" width="48" height="48" rx="15" fill="none" stroke="url(#ss-violet-grad)" stroke-width="6" />
  <path d="M 79 72 V 79 H 72" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95" />

  <!-- Center Sync Shutter Node -->
  <circle cx="48" cy="48" r="12" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" />

  <!-- 4-Point Luminous Shutter Star -->
  <path d="M 48 35 Q 48 46 37 48 Q 48 48 48 61 Q 48 50 59 48 Q 48 48 48 35 Z" fill="url(#ss-spark-grad)" />
  <circle cx="48" cy="48" r="2.5" fill="#ffffff" />
</svg>
